<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XDSS Apps</title>
<meta name="description" content="Small, calm Android apps by XDSS.">
<style>
  :root { --bg: #f8f9fb; --fg: #1a1c1f; --muted: #42474e; --accent: #2d5b86; --line: #c2c7cf; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111316; --fg: #e2e2e6; --muted: #c2c7cf; --accent: #9dc9f5; --line: #42474e; --card: #1a1c1f; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-family: Georgia, "Noto Serif", serif; font-weight: 500; font-size: 32px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 0 0 16px; }
  .app h2 { font-size: 20px; margin: 0 0 4px; }
  .app p { margin: 0 0 8px; color: var(--muted); }
  .links a { margin-right: 16px; }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>XDSS Apps</h1>
<p class="lead">Small, calm Android apps. No accounts, no clutter.</p>

<section class="app">
  <h2>Stillgrid: Calm Sudoku</h2>
  <p>A calm, classic 9x9 Sudoku with a clean board, notes and hints. Works offline.</p>
  <div class="links">
    <a href="https://play.google.com/store/apps/details?id=com.xdss.stillgrid">Google Play</a>
    <a href="https://sebastianradutoiu.github.io/xdss-privacy/stillgrid/">Privacy policy</a>
    <a href="https://sebastianradutoiu.github.io/xdss-privacy/stillgrid/terms/">Terms of Service</a>
  </div>
</section>

<footer>Contact: <a href="mailto:sebiradutoiu@gmail.com">sebiradutoiu@gmail.com</a></footer>
</main>
</body>
</html>
